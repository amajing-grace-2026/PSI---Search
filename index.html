*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;font-variant-numeric:tabular-nums}
header{background:var(--navy);color:#fff;padding:18px 20px}
.hd{max-width:1280px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.sub{margin:2px 0 0;font-size:.85rem;color:#b9cbe4}
.wa{display:inline-flex;align-items:center;gap:8px;background:var(--wa);color:#fff;text-decoration:none;font-weight:600;font-size:.9rem;padding:9px 16px;border-radius:999px}
.wa:hover{filter:brightness(1.08)}
.wa:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #ffb900;outline-offset:2px}
main{max-width:1280px;margin:0 auto;padding:16px 20px 80px;display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
aside{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;position:sticky;top:12px}
aside summary{display:none}
label.f{display:block;font-size:.8rem;font-weight:600;color:var(--mute);margin:12px 0 4px}
label.f:first-of-type{margin-top:0}
input[type=search],input[type=number],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem}
.pr{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;color:var(--mute)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;margin-top:12px;cursor:pointer}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--blue)}
.reset{margin-top:16px;width:100%;padding:9px;border:1px solid var(--blue);background:transparent;color:var(--blue);border-radius:7px;font:inherit;font-weight:600;cursor:pointer}
.reset:hover{background:var(--sky)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.count{font-weight:700;font-size:1.05rem}
.count small{font-weight:400;color:var(--mute);font-size:.85rem}
.sort{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--mute)}
.sort select{width:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{text-align:left;font-size:.78rem;color:var(--mute);font-weight:600;padding:10px 12px;background:var(--sky);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.88rem}
tr:last-child td{border-bottom:0}
.m{font-weight:700;color:var(--blue);word-break:break-word}
.seg{display:block;font-size:.78rem;color:var(--mute);font-weight:400}
.spec{color:var(--mute);font-size:.82rem;max-width:380px;word-break:break-word}
.price{font-weight:700;white-space:nowrap}
.price.na{color:var(--mute);font-weight:500}
.dist{font-weight:700}
.b{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.s-banyak{background:var(--okbg);color:var(--ok)}.s-cukup{background:var(--midbg);color:var(--mid)}.s-sedikit{background:var(--warnbg);color:var(--warn)}.s-limit{background:var(--lowbg);color:var(--low)}.s-kosong{background:var(--nonebg);color:var(--none)}
.ask{display:inline-block;color:var(--wa);font-weight:600;font-size:.82rem;text-decoration:none;border:1px solid var(--wa);padding:4px 10px;border-radius:999px;white-space:nowrap}
.ask:hover{background:var(--wa);color:#fff}
.more{display:block;margin:16px auto 0;padding:10px 28px;border:0;background:var(--blue);color:#fff;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:36px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.note{font-size:.78rem;color:var(--mute);margin-top:14px}
@media (max-width:860px){
 main{grid-template-columns:1fr;padding:12px}
 aside{position:static;padding:0}
 aside summary{display:block;padding:13px 16px;font-weight:700;cursor:pointer;list-style:none}
 aside .fbody{padding:0 16px 16px}
 thead{display:none}
 table,tbody,tr,td{display:block;width:100%}
 table{background:transparent;border:0}
 tr{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:10px 12px}
 td{border:0;padding:3px 0}

 .spec{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

// kolom: 0 model,1 tipe,2 segmen,3 processor,4 spesifikasi,5 harga(ribu),6 status,7 distributor,8 stok
const RANK={"Banyak sekali":5,"Banyak":4,"Cukup":3,"Sedikit":2,"Limit":1,"Kosong":0};
const CLS={"Banyak sekali":"s-banyak","Banyak":"s-banyak","Cukup":"s-cukup","Sedikit":"s-sedikit","Limit":"s-limit","Kosong":"s-kosong"};
const $=id=>document.getElementById(id);
const fmt=n=>"Rp "+(n*1000).toLocaleString("id-ID");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uniq=i=>[...new Set(D.map(r=>r[i]))].filter(Boolean);
function fill(id,label,vals,sorter){const s=$(id);s.innerHTML='<option value="">'+label+'</option>'+vals.sort(sorter).map(v=>'<option>'+esc(v)+'</option>').join('')}
fill("tipe","Semua tipe",uniq(1));
fill("seg","Semua segmen",uniq(2).filter(v=>!["EOL","Tender","(blank)"].includes(v)));
fill("proc","Semua processor",uniq(3));
fill("dist","Semua distributor",uniq(7));
fill("stok","Semua status stok",Object.keys(RANK),(a,b)=>RANK[b]-RANK[a]);
$("total").textContent=D.length.toLocaleString("id-ID");
$("waTop").href="https://wa.me/"+WA+"?text="+encodeURIComponent("Halo, saya mau tanya stok dan harga produk ASUS.");
let list=[],shown=0;const PAGE=50;
function apply(){
 const toks=$("q").value.toLowerCase().split(/\s+/).filter(Boolean);
 const t=$("tipe").value,sg=$("seg").value,p=$("proc").value,d=$("dist").value,st=$("stok").value;
 const mn=parseFloat($("pmin").value),mx=parseFloat($("pmax").value);
 const ada=$("ada").checked,all=$("all").checked;
 list=D.filter(r=>{
  if(!all&&r[6]!=="Aktif")return false;
  if(t&&r[1]!==t)return false; if(sg&&r[2]!==sg)return false;
  if(p&&r[3]!==p)return false; if(d&&r[7]!==d)return false; if(st&&r[8]!==st)return false;
  if(ada&&!RANK[r[8]])return false;
  if(!isNaN(mn)&&(!r[5]||r[5]/1000<mn))return false;
  if(!isNaN(mx)&&(!r[5]||r[5]/1000>mx))return false;
  if(toks.length){const h=(r[0]+" "+r[4]+" "+r[3]+" "+r[2]+" "+r[7]).toLowerCase();for(const k of toks)if(!h.includes(k))return false}
  return true});
 const s=$("sort").value;
 const price=r=>r[5]||Infinity;
 list.sort(s==="pa"?(a,b)=>price(a)-price(b):s==="pd"?(a,b)=>(b[5]||-1)-(a[5]||-1):s==="st"?(a,b)=>RANK[b[8]]-RANK[a[8]]||price(a)-price(b):(a,b)=>a[0].localeCompare(b[0]));
 shown=0;$("out").innerHTML="";render();
}
function row(r){
 const pr=r[5]?'<span class="price">'+fmt(r[5])+'</span>':'<span class="price na">'+(r[6]==="Tanpa harga"?"-":r[6])+'</span>';
 const msg=encodeURIComponent("Halo, saya mau tanya stok & harga "+r[0]+" di distributor "+r[7]+".");
 return '<tr><td data-l="Model"><span class="m">'+esc(r[0])+'</span><span class="seg">'+esc(r[1])+' · '+esc(r[2])+'</span></td>'
 +'<td data-l="Processor">'+esc(r[3])+'</td>'
 +'<td class="spec">'+esc(r[4])+'</td>'
 +'<td data-l="Harga">'+pr+'</td>'
 +'<td data-l="Distributor"><span class="dist">'+esc(r[7])+'</span></td>'
 +'<td data-l="Stok"><span class="b '+(CLS[r[8]]||"s-kosong")+'">'+esc(r[8])+'</span></td>'
 +'<td><a class="ask" target="_blank" rel="noopener" href="https://wa.me/'+(WAD[r[7]]||WA)+'?text='+msg+'">Tanya sales</a></td></tr>';
}
function render(){
 const out=$("out");
 $("count").innerHTML=list.length.toLocaleString("id-ID")+' <small>hasil</small>';
 if(!list.length){out.innerHTML='<div class="empty"><b>Tidak ada hasil</b>Longgarkan filter, ubah kata kunci, atau centang "Tampilkan semua".</div>';$("more").hidden=true;return}
 if(!shown)out.innerHTML='<table><thead><tr><th>Model</th><th>Processor</th><th>Spesifikasi</th><th>Harga</th><th>Distributor</th><th>Stok</th><th></th></tr></thead><tbody></tbody></table>';
 const next=list.slice(shown,shown+PAGE);
 out.querySelector("tbody").insertAdjacentHTML("beforeend",next.map(row).join(""));
 shown+=next.length;
 $("more").hidden=shown>=list.length;
 $("more").textContent="Tampilkan "+Math.min(PAGE,list.length-shown)+" lagi (sisa "+(list.length-shown).toLocaleString("id-ID")+")";
}
$("more").onclick=render;
let tm;$("q").addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(apply,150)});
